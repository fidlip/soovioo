name: Bug
description: Something doesn't work as it should.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security issues here** — see [SECURITY.md](https://github.com/fidlip/soovioo/blob/main/SECURITY.md).

        Issues are public: no personal data of pupils, parents or staff.
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to reproduce, page, role (admin, teacher, parent, student…).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Error messages, screenshots.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
