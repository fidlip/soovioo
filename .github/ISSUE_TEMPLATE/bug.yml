name: Bug / Chyba
description: Something doesn't work as it should. / Něco nefunguje, jak má.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security issues here** — see [SECURITY.md](blob/main/SECURITY.md).
        Bezpečnostní problémy sem nehlaste, viz SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: What did you do? / Co jste udělali?
      description: Steps to reproduce, page, role (admin, teacher, parent, student…).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / Co jste čekali?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead? / Co se stalo místo toho?
      description: Error messages, screenshots.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device / Prohlížeč / zařízení
