name: Idea
description: A new feature or an improvement.
type: Feature
labels: [enhancement, needs-discussion]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public: no personal data of pupils, parents or staff.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Who needs it and why (role, situation).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Alternatives, open questions, links.
