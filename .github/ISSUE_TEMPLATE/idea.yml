name: Idea / Nápad
description: A new feature or an improvement. / Nová funkce nebo vylepšení.
type: Feature
labels: [enhancement, needs-discussion]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public: no personal data of pupils, parents or staff. /
        Hlášení je veřejné: nepište osobní údaje žáků, rodičů ani zaměstnanců.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? / Jaký problém to řeší?
      description: Who needs it and why (role, situation).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / Návrh
      description: How it could work.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / Poznámky
      description: Alternatives, open questions, links.
