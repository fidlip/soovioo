name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx nx format:check --base=remotes/origin/main
      - run: npx nx run-many -t lint
      - run: npx nx run-many -t test
      - run: npx nx run-many -t typecheck
      # nativescript-mobile's build needs the Android/iOS native toolchain,
      # which isn't installed here — it's built/verified on-device manually
      # instead (see ROADMAP.md).
      - run: npx nx run-many -t build --exclude=nativescript-mobile

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-only placeholder — never a real secret, see Program.cs (it refuses
      # to start without one; appsettings.json deliberately has none).
      Jwt__SigningKey: ci-only-signing-key-this-is-not-a-real-secret-32chars
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start backend
        working-directory: backend/src/Sova.Api
        run: |
          dotnet run --urls http://0.0.0.0:5080 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5080/api/auth/login && break
            sleep 1
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          npx nx run web:serve --host 0.0.0.0 --port 4200 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4200 && break
            sleep 1
          done

      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx nx run web-e2e:e2e
