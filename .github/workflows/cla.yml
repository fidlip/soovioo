name: CLA

# Contributors must sign CLA.md once before their pull request can be merged. Signatures
# are stored as JSON on the `cla-signatures` branch (created by the action on first use).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/fidlip/soovioo/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "fidlip,dependabot[bot],renovate[bot]"
