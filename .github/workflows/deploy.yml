name: Deploy

# After CI passes on main: build the images here (not on the small VPS),
# push them to GHCR, copy deploy/ to the server and restart the stack.
# Server setup and the required secrets: deploy/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # workflow_run runs on the default branch's latest commit; deploy exactly
  # the commit CI tested instead.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/fidlip/soovioo-${{ matrix.name }}:latest
            ghcr.io/fidlip/soovioo-${{ matrix.name }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy deploy files
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/soovioo/
      - name: Pull and restart
        # GITHUB_TOKEN (valid only while this job runs) lets the server pull
        # the private images — no long-lived registry credential on the VPS.
        # Sent on stdin, so it never shows up in the server's process list.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sh /opt/soovioo/deploy.sh ${{ env.SHA }} ${{ github.actor }}"
