name: Release

# A published release (drafted by scripts/release.sh) puts its commit into
# production: the images CI already built, tested and ran on the test
# instance — nothing is built again. They also get the release's version
# and "latest" as tags.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    # A pre-release is not a release of the app; the backoffice ignores it too.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]{2}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "::error::$TAG is not a release version vRR.M.N"
            exit 1
          fi
          sha=$(git rev-parse "$TAG^{commit}")
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$TAG points to $sha, which is not in main"
            exit 1
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&branch=main" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
          if [ "$passed" = 0 ]; then
            echo "::error::$sha has no successful CI run on main (tests, images, test instance)"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the images with the release
        env:
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for image in soovioo-api soovioo-web; do
            docker buildx imagetools create \
              -t "ghcr.io/fidlip/$image:$VERSION" -t "ghcr.io/fidlip/$image:latest" \
              "ghcr.io/fidlip/$image:$SHA"
          done

  deploy:
    needs: check
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      sha: ${{ needs.check.outputs.sha }}
      version: ${{ needs.check.outputs.version }}
    secrets: inherit
