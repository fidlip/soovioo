name: RVP sources

# Once a month: did the RVPs change since the catalog was built? See
# backend/tools/check_rvp_sources.py. A difference is reported as an issue.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: 'RVP: změna ve zdrojích'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Compare with the sources
        run: python3 backend/tools/check_rvp_sources.py --cache "$RUNNER_TEMP/rvp" --report "$RUNNER_TEMP/report.md"

      - name: Report a difference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$RUNNER_TEMP/report.md" ]; then
            exit 0
          fi
          open=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE))[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/report.md" --label infra
          fi
