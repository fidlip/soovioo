services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soovioo
    ports:
      - "5432:5432"
    volumes:
      - soovioo-postgres-data:/var/lib/postgresql/data

  # Local mail-catcher for dev — nothing leaves the machine. SMTP on 1025
  # (matches appsettings.Development.json's Smtp:Port, no auth needed) and a
  # web UI on 8025 to actually read the invite e-mails sent during testing.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  soovioo-postgres-data:
