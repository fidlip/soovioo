<ActionBar title="Soovioo — Docházka"></ActionBar>

<GridLayout rows="auto, auto, *">
  <ns-nav-bar row="0"></ns-nav-bar>

  <StackLayout row="1" orientation="horizontal" class="p-4">
    <Label
      [text]="
        students()[selectedStudentIndex]?.firstName +
          ' ' +
          students()[selectedStudentIndex]?.lastName
          | nameText: students()[selectedStudentIndex]?.label
      "
    ></Label>
    <Button
      text="Zapsat absenci (dnes)"
      (tap)="addAbsence()"
      *ngIf="canManageAbsences()"
    ></Button>
  </StackLayout>

  <ListView #list row="2" [items]="absences()">
    <ng-template let-item="item">
      <StackLayout
        class="p-4"
        [class.app-highlight]="item.id === highlight.id()"
      >
        <Label
          [text]="
            (item.studentName | nameText: item.studentLabel) +
            ' — ' +
            (item.date | dateFormat: 'date') +
            ' — ' +
            item.status
          "
        ></Label>
        @if (item.excuseReason) {
          <Label [text]="'(' + item.excuseReason + ')'"></Label>
        }
        @if (item.status === 'Unexcused' && canSubmitExcuse()) {
          <Button text="Omluvit (Nemoc)" (tap)="submitExcuse(item)"></Button>
        }
        @if (item.status === 'PendingExcuse' && canManageAbsences()) {
          <StackLayout orientation="horizontal">
            <Button text="Schválit" (tap)="review(item, true)"></Button>
            <Button text="Zamítnout" (tap)="review(item, false)"></Button>
          </StackLayout>
        }
      </StackLayout>
    </ng-template>
  </ListView>
</GridLayout>
