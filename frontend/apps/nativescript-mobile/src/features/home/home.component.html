<ActionBar title="Sova — Známky"></ActionBar>

<GridLayout rows="auto, auto, *">
  <ns-nav-bar row="0"></ns-nav-bar>

  <Button
    row="1"
    text="Zapsat známku (ukázka)"
    (tap)="addDemoGrade()"
    *ngIf="canAddGrade()"
  ></Button>

  <ListView row="2" [items]="grades()">
    <ng-template let-item="item">
      <StackLayout class="p-4">
        <Label
          [text]="item.studentName + ' — ' + item.subjectName + ': ' + item.value + ' (váha ' + item.weight + ')' + (item.note ? ' (' + item.note + ')' : '')"
          class="text-lg"
        ></Label>
      </StackLayout>
    </ng-template>
  </ListView>
</GridLayout>
