<ScrollView orientation="horizontal">
  <StackLayout orientation="horizontal" class="p-2">
    @if (schoolName) {
      <Button [text]="'Škola: ' + schoolName" (tap)="chooseAccount()"></Button>
    }
    <Button
      [text]="unread() > 0 ? 'Upozornění (' + unread() + ')' : 'Upozornění'"
      [nsRouterLink]="['/notifications']"
    ></Button>
    <Button text="Známky" [nsRouterLink]="['/grades']"></Button>
    <Button text="Docházka" [nsRouterLink]="['/absences']"></Button>
    <Button text="Rozvrh" [nsRouterLink]="['/timetable']"></Button>
    <Button text="Zprávy" [nsRouterLink]="['/messages']"></Button>
    <Button text="Nastavení" [nsRouterLink]="['/settings']"></Button>
    <Button text="Odhlásit" (tap)="logout()"></Button>
  </StackLayout>
</ScrollView>
