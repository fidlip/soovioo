<div class="mx-auto flex max-w-sm flex-col gap-4 pt-8 sm:pt-16">
  <div class="text-center">
    <img
      src="/images/logo.svg"
      alt="Soovioo"
      class="mx-auto h-24 w-auto dark:brightness-0 dark:invert"
    />
    <h1
      class="mt-3 mb-0 text-2xl font-semibold text-surface-900 dark:text-surface-0"
    >
      Vítejte v Soovioo
    </h1>
    <p class="mt-1 text-sm text-surface-500 dark:text-surface-400">
      Nastavte si vlastní heslo a přihlaste se.
    </p>
  </div>

  <p-card>
    @if (!token) {
    <p-message
      severity="error"
      text="Odkaz je neplatný — chybí pozvánkový token. Zkontrolujte, jestli jste otevřeli celý odkaz z e-mailu."
    />
    } @else {
    <form
      class="flex flex-col gap-4"
      #inviteForm="ngForm"
      (ngSubmit)="acceptInvite()"
    >
      <app-float-field label="Nové heslo" for="newPassword">
        <p-password
          inputId="newPassword"
          name="newPassword"
          required
          styleClass="w-full"
          inputStyleClass="w-full"
          [(ngModel)]="newPassword"
          [toggleMask]="true"
          [feedback]="false"
        />
      </app-float-field>

      <app-float-field label="Nové heslo znovu" for="confirmNewPassword">
        <p-password
          inputId="confirmNewPassword"
          name="confirmNewPassword"
          required
          styleClass="w-full"
          inputStyleClass="w-full"
          [(ngModel)]="confirmNewPassword"
          [toggleMask]="true"
          [feedback]="false"
        />
      </app-float-field>

      @if (error(); as errorMessage) {
      <p-message severity="error" [text]="errorMessage" />
      }

      <app-submit-button
        [form]="inviteForm"
        label="Nastavit heslo a přihlásit se"
        class="w-full"
        [fullWidth]="true"
      />
    </form>
    }
  </p-card>
</div>
