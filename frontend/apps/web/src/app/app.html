<nav>
  <strong>Sova</strong>
  @if (isLoggedIn() && isSuperAdmin()) {
    <a routerLink="/superadmin">Správa škol</a>
    <button type="button" (click)="logout()">Odhlásit se</button>
  } @else if (isLoggedIn()) {
    <a [routerLink]="schoolContext.link('grades')">Známky</a>
    <a [routerLink]="schoolContext.link('absences')">Docházka</a>
    <a [routerLink]="schoolContext.link('timetable')">Rozvrh</a>
    <a [routerLink]="schoolContext.link('messages')">Zprávy</a>
    @if (isAdmin()) {
      <a [routerLink]="schoolContext.link('admin')">Administrace</a>
    }
    <button type="button" (click)="logout()">Odhlásit se</button>
  } @else {
    <a [routerLink]="schoolContext.link('login')">Přihlásit se</a>
  }
</nav>

<main>
  <router-outlet />
</main>
