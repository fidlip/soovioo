@if (showSidebar()) {
<app-sidebar />
} @else if (!hideHeader()) {
<app-public-header />
}

<main
  class="app-main px-4 pt-4 pb-8 sm:px-6 sm:pt-8 lg:px-8"
  [class.with-sidebar]="showSidebar()"
  [class.sidebar-collapsed]="sidebarState.collapsed()"
>
  <app-demo-shell />
  @if (isLoggedIn() && canLinkAccounts()) {
  <app-link-account-dialog />
  }
  <app-notices />
  <router-outlet />
</main>

<p-confirmDialog />

<p-toast
  position="top-right"
  [breakpoints]="{ '640px': { width: 'calc(100% - 2rem)', right: '1rem', left: '1rem' } }"
/>
