<p-dialog
  [visible]="feedback.open()"
  (visibleChange)="feedback.open.set($event)"
  header="Jak se vám Soovioo líbí?"
  [modal]="true"
  [dismissableMask]="true"
  styleClass="w-full max-w-md"
>
  <app-feedback-form
    idPrefix="demo-feedback"
    privacyUrl="https://soovioo.cz/zasady.html#demo"
    [send]="send"
    (sent)="feedback.mute()"
  >
    <p-button
      type="button"
      label="Už se neptat"
      [text]="true"
      severity="secondary"
      (onClick)="feedback.mute()"
    />
  </app-feedback-form>
</p-dialog>
