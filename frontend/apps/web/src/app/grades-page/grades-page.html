<div class="mb-6 flex flex-wrap items-end justify-between gap-4">
  <h1 class="mb-0 flex items-center gap-3"><app-icon name="grades" />Známky</h1>
  <div class="flex flex-wrap items-end gap-3">
    <div class="flex flex-col gap-1.5">
      <label
        for="reportCardStudent"
        class="text-sm font-medium text-surface-600 dark:text-surface-300"
        >Žák</label
      >
      <p-select
        inputId="reportCardStudent"
        [options]="studentOptions()"
        optionLabel="label"
        optionValue="id"
        [(ngModel)]="reportCardStudentId"
        name="reportCardStudent"
        appendTo="body"
        styleClass="w-52"
      />
    </div>
    <p-button
      label="Stáhnout vysvědčení"
      icon="pi pi-download"
      severity="secondary"
      [outlined]="true"
      (onClick)="downloadReportCard()"
    />
    @if (canAddGrade()) {
    <p-button
      label="Zapsat známku"
      icon="pi pi-plus"
      (onClick)="openAddGradeDialog()"
    />
    }
  </div>
</div>

<div class="mb-3 flex flex-wrap items-end gap-3">
  <div class="flex flex-col gap-1.5">
    <label
      for="filterStudent"
      class="text-sm font-medium text-surface-600 dark:text-surface-300"
      >Žák</label
    >
    <p-select
      inputId="filterStudent"
      [options]="studentOptions()"
      optionLabel="label"
      optionValue="id"
      placeholder="Všichni žáci"
      [(ngModel)]="filterStudentId"
      [showClear]="true"
      name="filterStudent"
      appendTo="body"
      styleClass="w-52"
    />
  </div>
  <div class="flex flex-col gap-1.5">
    <label
      for="filterSubject"
      class="text-sm font-medium text-surface-600 dark:text-surface-300"
      >Předmět</label
    >
    <p-select
      inputId="filterSubject"
      [options]="subjects()"
      optionLabel="name"
      optionValue="id"
      placeholder="Všechny předměty"
      [(ngModel)]="filterSubjectId"
      [showClear]="true"
      name="filterSubject"
      appendTo="body"
      styleClass="w-48"
    />
  </div>
</div>

<p-table [value]="filteredGrades()" dataKey="id" styleClass="rounded-border">
  <ng-template pTemplate="header">
    <tr>
      <th>Žák</th>
      <th>Předmět</th>
      <th>Známka</th>
      <th>Váha</th>
      <th>Poznámka</th>
      @if (canAddGrade()) {
      <th></th>
      }
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-grade>
    <tr>
      <td>{{ grade.studentName }}</td>
      <td>{{ grade.subjectName }}</td>
      <td>
        <p-tag
          [value]="grade.value + ''"
          [severity]="gradeSeverity(grade.value)"
          [rounded]="true"
        />
      </td>
      <td>{{ grade.weight }}</td>
      <td class="text-surface-500">{{ grade.note }}</td>
      @if (canAddGrade()) {
      <td class="flex justify-end gap-1">
        <p-button
          icon="pi pi-pencil"
          size="small"
          [text]="true"
          (onClick)="startEditGrade(grade)"
        />
        <p-button
          icon="pi pi-trash"
          size="small"
          severity="danger"
          [text]="true"
          (onClick)="deleteGrade(grade)"
        />
      </td>
      }
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="6" class="py-6 text-center text-surface-500">
        Zatím žádné známky.
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [visible]="gradeDialogVisible()"
  (visibleChange)="gradeDialogVisible.set($event)"
  [header]="editingGradeId === null ? 'Zapsat známku' : 'Upravit známku'"
  [modal]="true"
  styleClass="w-full max-w-lg"
>
  <form class="flex flex-col gap-3" (ngSubmit)="saveGrade()">
    <div class="flex flex-col gap-1.5">
      <label
        for="gradeStudent"
        class="text-sm font-medium text-surface-600 dark:text-surface-300"
        >Žák</label
      >
      <p-select
        inputId="gradeStudent"
        [options]="studentOptions()"
        optionLabel="label"
        optionValue="id"
        [(ngModel)]="newStudentId"
        name="gradeStudent"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label
        for="gradeSubject"
        class="text-sm font-medium text-surface-600 dark:text-surface-300"
        >Předmět</label
      >
      <p-select
        inputId="gradeSubject"
        [options]="subjects()"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="newSubjectId"
        name="gradeSubject"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="flex gap-4">
      <div class="flex flex-col gap-1.5">
        <label
          for="gradeValue"
          class="text-sm font-medium text-surface-600 dark:text-surface-300"
          >Známka</label
        >
        <p-inputNumber
          inputId="gradeValue"
          [(ngModel)]="newValue"
          name="gradeValue"
          [min]="1"
          [max]="5"
          [showButtons]="true"
          styleClass="w-28"
          inputStyleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label
          for="gradeWeight"
          class="text-sm font-medium text-surface-600 dark:text-surface-300"
          >Váha</label
        >
        <p-inputNumber
          inputId="gradeWeight"
          [(ngModel)]="newWeight"
          name="gradeWeight"
          [min]="1"
          [max]="10"
          styleClass="w-24"
          inputStyleClass="w-full"
        />
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label
        for="gradeNote"
        class="text-sm font-medium text-surface-600 dark:text-surface-300"
        >Poznámka</label
      >
      <input
        pInputText
        type="text"
        id="gradeNote"
        [(ngModel)]="newNote"
        name="gradeNote"
      />
    </div>

    <p-button
      type="submit"
      [label]="editingGradeId === null ? 'Zapsat' : 'Uložit'"
      icon="pi pi-check"
      styleClass="self-start"
    />
  </form>
</p-dialog>
