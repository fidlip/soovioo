<h1>Známky</h1>

@if (canAddGrade()) {
  <form class="add-grade" (ngSubmit)="addGrade()">
    <select name="student" [(ngModel)]="selectedStudentId">
      @for (student of students(); track student.id) {
        <option [value]="student.id">{{ student.firstName }} {{ student.lastName }}</option>
      }
    </select>

    <select name="subject" [(ngModel)]="selectedSubjectId">
      @for (subject of subjects(); track subject.id) {
        <option [value]="subject.id">{{ subject.name }}</option>
      }
    </select>

    <input type="number" name="value" min="1" max="5" [(ngModel)]="value" />

    <button type="submit">Zapsat známku</button>
  </form>
}

<button type="button" (click)="downloadReportCard()">Stáhnout vysvědčení</button>

<ul>
  @for (grade of grades(); track grade.id) {
    <li>
      {{ grade.studentName }} — {{ grade.subjectName }}: <strong>{{ grade.value }}</strong>
      @if (grade.note) {
        <em>({{ grade.note }})</em>
      }
    </li>
  } @empty {
    <li>Zatím žádné známky.</li>
  }
</ul>
