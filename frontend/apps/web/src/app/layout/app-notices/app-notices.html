@if (sessionSync.notice(); as notice) {
<div
  class="mb-4 flex flex-wrap items-center justify-between gap-2 rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-sm text-amber-900 dark:border-amber-700 dark:bg-amber-950 dark:text-amber-100"
  role="alert"
>
  <span><i class="pi pi-exclamation-triangle mr-1"></i>{{ notice }}</span>
  <button
    type="button"
    class="cursor-pointer rounded border border-amber-400 px-2 py-0.5 font-medium hover:bg-amber-100 dark:hover:bg-amber-900"
    (click)="reload()"
  >
    Načíst znovu
  </button>
</div>
} @if (authApi.getSupportInfo(); as support) {
<div
  class="mb-4 flex flex-wrap items-center justify-between gap-2 rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-sm text-amber-900 dark:border-amber-700 dark:bg-amber-950 dark:text-amber-100"
  role="status"
>
  <span
    ><i class="pi pi-shield mr-1"></i><strong>Režim podpory</strong> — {{
    support.schoolName }} · jako superadmin {{ support.by }} (změny se
    zaznamenávají)</span
  >
  <!-- Deferred: its Markdown editor is needed only in support mode. -->
  @defer (on idle) {
  <button
    type="button"
    class="cursor-pointer rounded border border-amber-400 px-2 py-0.5 font-medium hover:bg-amber-100 dark:hover:bg-amber-900"
    (click)="leaveDialog.open()"
  >
    Opustit
  </button>
  <app-support-leave-dialog #leaveDialog />
  } @placeholder {
  <button
    type="button"
    class="rounded border border-amber-400 px-2 py-0.5 font-medium opacity-60"
    disabled
  >
    Opustit
  </button>
  }
</div>
}
