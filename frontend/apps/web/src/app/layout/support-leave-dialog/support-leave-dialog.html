<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  header="Opustit režim podpory"
  [modal]="true"
  styleClass="w-full max-w-lg"
>
  <form (ngSubmit)="leave()">
    <app-markdown-editor
      label="Výsledek práce (nepovinné)"
      inputId="supportResult"
      name="result"
      [rows]="4"
      maxlength="8000"
      [(ngModel)]="result"
    />
    <p class="mt-2 text-sm text-surface-500">
      Např. „Škola nastavena dle požadavků Jana Nováka“. Zapíše se do vlákna
      požadavku (uvidí to admin školy) a do Logů.
    </p>
    <div class="mt-4 flex justify-end gap-2">
      <p-button
        label="Zpět"
        severity="secondary"
        [outlined]="true"
        (onClick)="visible.set(false)"
      />
      <p-button
        type="submit"
        label="Opustit"
        icon="pi pi-sign-out"
        [disabled]="leaving()"
      />
    </div>
  </form>
</p-dialog>
