<div class="mx-auto flex max-w-sm flex-col gap-4 pt-8 sm:pt-16">
  <div class="text-center">
    <img
      src="/images/logo.svg"
      alt="Soovioo"
      class="mx-auto h-24 w-auto dark:brightness-0 dark:invert"
    />
    <h1
      class="mt-3 mb-0 text-2xl font-semibold text-surface-900 dark:text-surface-0"
    >
      Přihlášení
    </h1>
    <p class="mt-1 text-sm text-surface-500 dark:text-surface-400">
      {{ schoolSlug ? (schoolName() ?? schoolSlug) : 'SuperAdmin' }}
    </p>
  </div>

  <p-card>
    <form class="flex flex-col gap-4" (ngSubmit)="login()">
      <div class="flex flex-col gap-1.5">
        <label
          for="username"
          class="text-sm font-medium text-surface-700 dark:text-surface-200"
        >
          Uživatelské jméno
        </label>
        <input
          pInputText
          id="username"
          name="username"
          class="w-full"
          [(ngModel)]="username"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label
          for="password"
          class="text-sm font-medium text-surface-700 dark:text-surface-200"
          >Heslo</label
        >
        <p-password
          inputId="password"
          name="password"
          styleClass="w-full"
          inputStyleClass="w-full"
          [(ngModel)]="password"
          [toggleMask]="true"
          [feedback]="false"
        />
      </div>

      <div class="flex items-center gap-2">
        <p-checkbox
          inputId="rememberMe"
          name="rememberMe"
          [binary]="true"
          [(ngModel)]="rememberMe"
        />
        <label
          for="rememberMe"
          class="text-sm text-surface-700 dark:text-surface-200"
          >Zůstat přihlášen</label
        >
      </div>

      @if (error(); as errorMessage) {
      <p-message severity="error" [text]="errorMessage" />
      }

      <p-button type="submit" label="Přihlásit se" styleClass="w-full" />
    </form>
  </p-card>

  @if (showDemoAccounts) { @if (schoolSlug) {
  <p class="text-center text-xs text-surface-500 dark:text-surface-400">
    Demo účty:
    <code
      class="rounded bg-surface-100 px-1 py-0.5 font-mono dark:bg-surface-800"
      >admin/admin123</code
    >,
    <code
      class="rounded bg-surface-100 px-1 py-0.5 font-mono dark:bg-surface-800"
      >ucitel/ucitel123</code
    >,
    <code
      class="rounded bg-surface-100 px-1 py-0.5 font-mono dark:bg-surface-800"
      >rodic/rodic123</code
    >,
    <code
      class="rounded bg-surface-100 px-1 py-0.5 font-mono dark:bg-surface-800"
      >zak/zak123</code
    >
  </p>
  } @else {
  <p class="text-center text-xs text-surface-500 dark:text-surface-400">
    Demo účet:
    <code
      class="rounded bg-surface-100 px-1 py-0.5 font-mono dark:bg-surface-800"
      >superadmin/superadmin123</code
    >
  </p>
  } }
</div>
