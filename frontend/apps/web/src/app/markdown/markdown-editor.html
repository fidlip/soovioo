<div class="bar">
  <div class="tabs" role="tablist">
    @if (labelInTab()) {
    <!-- The field's own label as the tab: clicking it also focuses the
      field, and the required asterisk lands on it. -->
    <label
      role="tab"
      tabindex="0"
      class="tab label-tab"
      [for]="inputId()"
      [attr.aria-selected]="!preview()"
      (click)="preview.set(false)"
      (keydown.enter)="write()"
      (keydown.space)="$event.preventDefault(); write()"
      >@if (internal()) {<i class="pi pi-lock mr-1 text-xs"></i>}{{ label()
      }}</label
    >
    } @else {
    <button
      type="button"
      role="tab"
      class="tab"
      [attr.aria-selected]="!preview()"
      (click)="preview.set(false)"
    >
      Text
    </button>
    }
    <button
      type="button"
      role="tab"
      class="tab"
      [attr.aria-selected]="preview()"
      (click)="preview.set(true)"
    >
      Náhled
    </button>
  </div>
  <button
    type="button"
    class="hint"
    aria-label="Formátování Markdown"
    pTooltip="Formátování Markdown: **tučně**, _kurzíva_, - seznam, [odkaz](https://…)"
    tooltipPosition="top"
    tooltipEvent="both"
  >
    <i class="pi pi-info-circle"></i>
  </button>
</div>
<div class="field">
  <ng-template #textarea>
    <textarea
      #field
      pTextarea
      class="w-full"
      [id]="inputId()"
      [rows]="rows()"
      [attr.maxlength]="maxlength()"
      [value]="value()"
      [disabled]="disabled()"
      (input)="input($any($event.target).value)"
      (blur)="onTouched()"
    ></textarea>
  </ng-template>
  @if (labelInTab()) {
  <div class="flex flex-col" [class.invisible]="preview()">
    <ng-container *ngTemplateOutlet="textarea" />
  </div>
  } @else {
  <app-float-field
    [label]="label()"
    [for]="inputId()"
    variant="in"
    [class.invisible]="preview()"
  >
    <ng-container *ngTemplateOutlet="textarea" />
  </app-float-field>
  } @if (preview()) {
  <div class="preview" [attr.aria-label]="label() + ' – náhled'">
    @if (value().trim()) {
    <app-markdown [text]="value()" />
    } @else {
    <span class="text-surface-500">Nic k náhledu.</span>
    }
  </div>
  }
  <div class="actions"><ng-content /></div>
</div>
