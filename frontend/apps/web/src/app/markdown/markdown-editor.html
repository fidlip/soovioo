<div class="bar">
  <div class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="tab"
      [attr.aria-selected]="!preview()"
      (click)="preview.set(false)"
    >
      Text
    </button>
    <button
      type="button"
      role="tab"
      class="tab"
      [attr.aria-selected]="preview()"
      (click)="preview.set(true)"
    >
      Náhled
    </button>
  </div>
  <button
    type="button"
    class="hint"
    aria-label="Formátování Markdown"
    pTooltip="Formátování Markdown: **tučně**, _kurzíva_, - seznam, [odkaz](https://…)"
    tooltipPosition="top"
    tooltipEvent="both"
  >
    <i class="pi pi-info-circle"></i>
  </button>
</div>
<div class="field">
  <app-float-field
    [label]="label()"
    [for]="inputId()"
    variant="in"
    [class.invisible]="preview()"
  >
    <textarea
      pTextarea
      class="w-full"
      [id]="inputId()"
      [rows]="rows()"
      [attr.maxlength]="maxlength()"
      [value]="value()"
      [disabled]="disabled()"
      (input)="input($any($event.target).value)"
      (blur)="onTouched()"
    ></textarea>
  </app-float-field>
  @if (preview()) {
  <div class="preview" [attr.aria-label]="label() + ' – náhled'">
    @if (value().trim()) {
    <app-markdown [text]="value()" />
    } @else {
    <span class="text-surface-500">Nic k náhledu.</span>
    }
  </div>
  }
  <div class="actions"><ng-content /></div>
</div>
