<span class="inline-flex flex-wrap items-center gap-1 text-xs text-surface-500"
  >Přezdívka ke schválení: <strong>„{{ proposal() }}“</strong>
  <p-button
    icon="pi pi-check"
    size="small"
    [text]="true"
    ariaLabel="Schválit přezdívku"
    title="Schválit přezdívku"
    (onClick)="decide(true)"
  />
  <p-button
    icon="pi pi-times"
    size="small"
    severity="secondary"
    [text]="true"
    ariaLabel="Zamítnout přezdívku"
    title="Zamítnout přezdívku"
    (onClick)="decide(false)"
  />
</span>
