<p-card>
  <ng-template #title
    >Hlavní výukový blok školy<app-info-hint
      text="Hodiny, ve kterých má každá třída každý den výuku. Generátor rozvrhu je zaplní hodinami pro celou třídu, volitelné předměty se nepočítají. Ročník ho může mít ve verzi rozvrhu jinak v Učebním plánu, třída ve Třídách."
  /></ng-template>
  <form class="flex flex-wrap items-end gap-2" (ngSubmit)="save()">
    <app-float-field label="Od hodiny" for="mainBlockFrom">
      <p-inputNumber
        inputId="mainBlockFrom"
        [(ngModel)]="from"
        name="mainBlockFrom"
        [min]="0"
        [max]="15"
        styleClass="w-40"
        inputStyleClass="w-full"
      />
    </app-float-field>
    <app-float-field label="Do hodiny" for="mainBlockTo">
      <p-inputNumber
        inputId="mainBlockTo"
        [(ngModel)]="to"
        name="mainBlockTo"
        [min]="0"
        [max]="15"
        styleClass="w-40"
        inputStyleClass="w-full"
      />
    </app-float-field>
    <p-button
      type="submit"
      label="Uložit"
      severity="secondary"
      [outlined]="true"
    />
  </form>
</p-card>
