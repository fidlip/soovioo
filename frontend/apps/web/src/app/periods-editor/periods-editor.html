<p-card>
  <ng-template #title
    >Časy hodin (zvonění)<app-info-hint
      text="Začátky a konce vyučovacích hodin pro rozvrh a docházku. Nultá hodina má číslo 0."
  /></ng-template>
  <table class="mb-4 w-full text-sm">
    <thead>
      <tr class="text-left text-surface-500">
        <th class="py-1">Hodina</th>
        <th class="py-1">Od</th>
        <th class="py-1">Do</th>
        <th><span class="sr-only">Akce</span></th>
      </tr>
    </thead>
    <tbody>
      @for (period of periods(); track period.periodNumber) { @if
      (editingPeriodNumber === period.periodNumber) {
      <tr>
        <td class="py-1">{{ period.periodNumber }}.</td>
        <td>
          <p-datePicker
            [(ngModel)]="editPeriodStartTime"
            name="editPeriodStartTime"
            [timeOnly]="true"
            hourFormat="24"
            appendTo="body"
          />
        </td>
        <td>
          <p-datePicker
            [(ngModel)]="editPeriodEndTime"
            name="editPeriodEndTime"
            [timeOnly]="true"
            hourFormat="24"
            appendTo="body"
          />
        </td>
        <td>
          <div class="flex justify-end gap-1 py-1">
            <p-button
              icon="pi pi-check"
              ariaLabel="Uložit"
              size="small"
              [text]="true"
              (onClick)="saveEditPeriod()"
            />
            <p-button
              icon="pi pi-times"
              ariaLabel="Zrušit"
              size="small"
              severity="secondary"
              [text]="true"
              (onClick)="cancelEditPeriod()"
            />
          </div>
        </td>
      </tr>
      } @else {
      <tr>
        <td class="py-1">{{ period.periodNumber }}.</td>
        <td class="py-1">{{ period.startTime.slice(0, 5) }}</td>
        <td class="py-1">{{ period.endTime.slice(0, 5) }}</td>
        <td>
          <div class="flex justify-end gap-1 py-1">
            <p-button
              icon="pi pi-pencil"
              ariaLabel="Upravit"
              size="small"
              [text]="true"
              (onClick)="startEditPeriod(period)"
            />
            <p-button
              icon="pi pi-trash"
              ariaLabel="Smazat"
              size="small"
              severity="danger"
              [text]="true"
              (onClick)="deletePeriod(period)"
            />
          </div>
        </td>
      </tr>
      } }
    </tbody>
  </table>
  <form
    class="flex flex-wrap items-end gap-3"
    #periodForm="ngForm"
    (ngSubmit)="addPeriod()"
  >
    <!-- Native number input: p-inputNumber cancels paste events. -->
    <input
      pInputText
      type="number"
      placeholder="Hodina"
      aria-label="Hodina"
      [(ngModel)]="newPeriodNumberToConfigure"
      name="newPeriodNumberToConfigure"
      required
      min="0"
      max="15"
      class="w-20"
    />
    <p-datePicker
      [(ngModel)]="newPeriodStartTime"
      name="newPeriodStartTime"
      required
      [timeOnly]="true"
      hourFormat="24"
      appendTo="body"
    />
    <p-datePicker
      [(ngModel)]="newPeriodEndTime"
      name="newPeriodEndTime"
      required
      [timeOnly]="true"
      hourFormat="24"
      appendTo="body"
    />
    <app-submit-button
      [form]="periodForm"
      label="Uložit čas"
      icon="pi pi-plus"
    />
  </form>
</p-card>
