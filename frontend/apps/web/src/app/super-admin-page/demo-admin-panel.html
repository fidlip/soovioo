<p-card header="Dema — kontakty" styleClass="mb-6">
  <div class="mb-3 flex justify-end">
    <p-button
      label="Export CSV"
      icon="pi pi-download"
      size="small"
      [outlined]="true"
      [disabled]="!contacts()?.length"
      (onClick)="downloadCsv()"
    />
  </div>
  <p-table
    [value]="contacts() ?? []"
    dataKey="id"
    [paginator]="(contacts()?.length ?? 0) > 10"
    [rows]="10"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>E-mail</th>
        <th>Souhlas</th>
        <th>Zdroj</th>
        <th>Demo</th>
        <th>Kdy</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-contact>
      <tr>
        <td>{{ contact.email }}</td>
        <td>
          <p-tag
            [severity]="contact.consent ? 'success' : 'secondary'"
            [value]="contact.consent ? 'ano' : 'ne'"
          />
        </td>
        <td class="text-surface-500">
          {{ contact.source === 'wizard' ? 'průvodce' : 'zpětná vazba' }}
        </td>
        <td class="text-surface-500">
          <code>{{ contact.demoSlug }}</code>
          @if (!contact.demoExists) { (smazáno) }
        </td>
        <td class="text-surface-500">
          {{ contact.createdAt | dateFormat: 'dateTime' }}
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="py-6 text-center text-surface-500">
          @if (contacts()) { Zatím nikdo nenechal kontakt. } @else {
          <app-loading class="justify-center" />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
