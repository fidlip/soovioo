<h1 class="mb-6 flex items-center gap-3">
  <app-icon name="superadmins" />Superadmini
</h1>

<p-card>
  <div class="mb-3 flex justify-end">
    <p-button
      label="Nový superadmin"
      icon="pi pi-plus"
      size="small"
      (onClick)="openAddSuperAdminDialog()"
    />
  </div>
  <p-table [value]="superAdmins()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Jméno</th>
        <th>Uživatelské jméno</th>
        <th>Kontakt</th>
        <th><span class="sr-only">Akce</span></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-superAdmin>
      <tr>
        <td>
          {{ superAdmin.name }} @if (superAdmin.id === myUserId) {
          <span class="text-sm text-surface-500">(vy)</span> }
        </td>
        <td class="text-surface-500">{{ superAdmin.username }}</td>
        <td class="text-surface-500">
          {{ superAdmin.email ?? superAdmin.phone ?? '—' }}
        </td>
        <td>
          <div class="flex justify-end gap-1">
            <p-button
              icon="pi pi-pencil"
              size="small"
              [text]="true"
              ariaLabel="Upravit superadmina"
              (onClick)="openEditSuperAdminDialog(superAdmin)"
            />
            @if (superAdmin.id !== myUserId && !superAdmin.builtIn) {
            <p-button
              icon="pi pi-trash"
              size="small"
              severity="danger"
              [text]="true"
              ariaLabel="Odebrat superadmina"
              (onClick)="deleteSuperAdmin(superAdmin)"
            />
            }
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [visible]="superAdminDialogVisible()"
  (visibleChange)="superAdminDialogVisible.set($event)"
  [header]="editingSuperAdminId === null ? 'Nový superadmin' : 'Upravit superadmina'"
  [modal]="true"
  styleClass="w-full max-w-lg"
>
  <form
    class="grid grid-cols-1 gap-3 sm:grid-cols-2"
    #superAdminForm="ngForm"
    (ngSubmit)="saveSuperAdmin()"
  >
    <app-float-field label="Jméno" for="superAdminFirstName">
      <input
        pInputText
        type="text"
        id="superAdminFirstName"
        name="superAdminFirstName"
        autocomplete="off"
        [(ngModel)]="superAdminFirstName"
      />
    </app-float-field>
    <app-float-field label="Příjmení" for="superAdminLastName">
      <input
        pInputText
        type="text"
        id="superAdminLastName"
        name="superAdminLastName"
        autocomplete="off"
        [(ngModel)]="superAdminLastName"
      />
    </app-float-field>
    <app-float-field label="Uživatelské jméno" for="superAdminUsername">
      <input
        pInputText
        type="text"
        id="superAdminUsername"
        name="superAdminUsername"
        autocomplete="off"
        required
        [readonly]="editingBuiltIn"
        [title]="editingBuiltIn ? 'Vestavěný účet nelze přejmenovat' : ''"
        [(ngModel)]="superAdminUsername"
      />
    </app-float-field>
    <app-float-field
      [label]="editingSuperAdminId === null ? 'Počáteční heslo' : 'Nové heslo'"
      for="superAdminPassword"
    >
      <p-password
        inputId="superAdminPassword"
        name="superAdminPassword"
        autocomplete="new-password"
        [required]="editingSuperAdminId === null"
        [minlength]="8"
        [(ngModel)]="superAdminPassword"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </app-float-field>
    <app-float-field label="Telefon" for="superAdminPhone">
      <input
        pInputText
        type="tel"
        id="superAdminPhone"
        name="superAdminPhone"
        autocomplete="off"
        [(ngModel)]="superAdminPhone"
      />
    </app-float-field>
    <app-float-field label="E-mail" for="superAdminEmail">
      <input
        pInputText
        type="email"
        id="superAdminEmail"
        name="superAdminEmail"
        autocomplete="off"
        email
        [(ngModel)]="superAdminEmail"
      />
    </app-float-field>
    <div class="sm:col-span-2">
      <app-submit-button
        [form]="superAdminForm"
        [label]="editingSuperAdminId === null ? 'Přidat superadmina' : 'Uložit'"
        icon="pi pi-check"
      />
    </div>
  </form>
</p-dialog>
