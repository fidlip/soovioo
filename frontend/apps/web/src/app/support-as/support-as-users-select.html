<app-float-field label="Podpora smí vstoupit jako" [for]="inputId()">
  <p-multiselect
    ariaLabel="Podpora smí vstoupit jako"
    [inputId]="inputId()"
    [options]="options()"
    optionLabel="name"
    optionValue="id"
    [ngModel]="userIds()"
    (ngModelChange)="userIds.set($event)"
    [ngModelOptions]="{ standalone: true }"
    [loading]="loading()"
    display="chip"
    [maxSelectedLabels]="null"
    [filter]="true"
    filterBy="name,roles"
    [virtualScroll]="options().length > 50"
    [virtualScrollItemSize]="44"
    styleClass="w-full"
    appendTo="body"
  >
    <ng-template #item let-option>
      <div class="flex flex-col leading-tight">
        <span>@if (option.me) {<strong>Já</strong> · }{{ option.name }}</span>
        <span class="text-xs text-surface-500">{{ option.roles }}</span>
      </div>
    </ng-template>
  </p-multiselect>
</app-float-field>
