<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  header="Za koho smí podpora vstoupit"
  [modal]="true"
  styleClass="w-full max-w-lg"
>
  @if (visible()) {
  <form class="flex flex-col gap-3 pt-2" (ngSubmit)="save()">
    <p class="m-0 text-sm text-surface-500">
      Kvůli tomuto požadavku smí podpora vstoupit jako vybraní uživatelé — vy,
      nebo třeba ten, koho se problém týká. Uvidí aplikaci tak jako on a může
      jeho jménem měnit data, ale zprávy neodešle a omluvenky nenapíše. Vše je v
      Logech. Bez výběru do školy nevstoupí.
    </p>
    <app-support-as-users-select
      inputId="ticketSupportAsUsers"
      [(userIds)]="userIds"
    />
    <div class="mt-2 flex justify-end gap-2">
      <p-button
        label="Zpět"
        severity="secondary"
        [outlined]="true"
        (onClick)="visible.set(false)"
      />
      <p-button
        type="submit"
        label="Uložit"
        icon="pi pi-check"
        [disabled]="busy()"
      />
    </div>
  </form>
  }
</p-dialog>
